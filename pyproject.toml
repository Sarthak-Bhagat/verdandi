[project]
name = "scrobd"
version = "0.1.0"
description = "Identity-first scrobbler for a *arr-managed library"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
    "ty>=0.0.86",
]

[project.scripts]
scrobd = "scrobd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

# Present, though empty, on purpose: it declares the repo ruff-formatted, which is the
# marker the editor checks before formatting on save. `ruff format --check` is part of
# the gate.
[tool.ruff.format]

[tool.ruff.lint]
select = ["ALL"]

# Every entry states why the rule cannot apply here, not that it is noisy.
ignore = [
  "D203",    # mutually exclusive with D211, which is the one we keep; ruff warns if both are on
  "D213",    # mutually exclusive with D212, which is the one we keep; same
  "COM812",  # trailing commas are the formatter's output, not a lint decision
  "ISC001",  # implicit string concatenation: same, the formatter owns it
  "CPY001",  # per-file copyright headers: no legal requirement on a single-user tool
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",     # the rule guards production code, where `assert` is stripped under
              # `python -O`. pytest IS assert; there is no production path here.
  "PLR2004",  # a literal expectation is the content of a test, not a magic number
  "ANN",      # a test is fixtures in, None out; annotating that carries no information
  "D103",     # a test's name is its documentation. D100 still applies, so every test
              # module must say in one line what it covers.
  "INP001",   # tests/ is deliberately not a package. The shadowing this rule guards
              # against needs two test modules sharing a basename; all ours are unique.
]
"tests/test_mpv_launcher.py" = [
  "S603",     # the test launches real mpv on purpose. Its argv is built from tmp_path
              # and shutil.which("mpv") -- an absolute path, so S607 never fires -- and
              # nothing in it is untrusted.
]
"src/scrobd/cli.py" = [
  "T201",     # ruff's own docs for this rule: print "used to produce output as a part
              # of a command-line interface program are not typically a problem". The
              # rule guards library code, where printing hides output from a caller.
              # This is the entry point; printing is the interface. sys.stdout.write
              # would satisfy the checker while reading worse and hand-managing newlines.
]
